<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu projeto em 3D · KitClos</title>
<meta name="theme-color" content="#0A1220">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  :root { --bg:#0A1220; --ink:#EAF2FA; --muted:#9FB0C3; --accent:#4FB0FF; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; height:100dvh; overflow:hidden; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header, footer { flex:none; }
  #stage { position:relative; flex:1 1 auto; min-height:0; display:flex; }
  header { padding:14px 18px 10px; display:flex; align-items:center; gap:12px; }
  header svg { flex:none; }
  .t1 { font-size:18px; font-weight:700; line-height:1.2; }
  .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
  model-viewer { position:absolute; inset:0; width:100%; height:100%; background:radial-gradient(circle at 50% 40%, #1b2a42 0%, #0A1220 75%); --poster-color:transparent; }
  .ar { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--accent); color:#04111F; border:0;
        border-radius:999px; padding:14px 22px; font-size:16px; font-weight:700; box-shadow:0 6px 24px rgba(79,176,255,.45); }
  footer { padding:10px 18px 16px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; }
  footer a { color:var(--accent); text-decoration:none; }
  .hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(10,18,32,.75); padding:6px 12px; border-radius:999px; font-size:12px; color:var(--muted); }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <svg width="38" height="38" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#121C2E"/><path d="M14 14h36v10H24v26H14z" fill="none" stroke="#4FB0FF" stroke-width="3"/><rect x="17" y="17" width="9" height="9" fill="#4FB0FF" opacity=".6"/><rect x="30" y="17" width="9" height="5" fill="#4FB0FF" opacity=".6"/><rect x="33" y="34" width="14" height="8" rx="1.5" fill="none" stroke="#EAF2FA" stroke-width="2"/></svg>
  <div><div class="t1" id="title">Carregando o projeto…</div><div class="t2" id="sub"></div></div>
</header>
<div id="stage">
  <div class="msg" id="msg">Carregando…</div>
</div>
<footer id="foot"></footer>
<script>
const SUPA = "https://trivhkkxkdxjrgxgxntn.supabase.co/storage/v1/object/public/kitclos/";
const k = new URLSearchParams(location.search).get("k");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if (!k || !/^[a-z0-9]{8,40}$/.test(k)) {
  $("title").textContent = "Link inválido"; $("msg").textContent = "Peça um link novo ao seu projetista.";
} else {
  fetch(SUPA + k + ".json").then(r => r.ok ? r.json() : {}).catch(() => ({})).then(info => {
    $("title").textContent = (info.name || "Seu projeto") + (info.client ? " · " + info.client : "");
    $("sub").textContent = info.finish || "";
    document.title = (info.name || "Projeto") + " · " + (info.company || "KitClos");
    const parts = [];
    if (info.company) parts.push("<b>" + esc(info.company) + "</b>");
    if (info.phone) parts.push('<a href="tel:' + esc(info.phone.replace(/[^+\d]/g, "")) + '">' + esc(info.phone) + "</a>");
    if (info.email) parts.push('<a href="mailto:' + esc(info.email) + '">' + esc(info.email) + "</a>");
    parts.push("Gire com um dedo · zoom com dois");
    $("foot").innerHTML = parts.join(" · ");
    $("stage").innerHTML =
      '<model-viewer src="' + SUPA + k + '.glb" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" rotation-per-second="18deg" ' +
      'shadow-intensity="1" exposure="1.05" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" ' +
      'camera-orbit="-25deg 62deg auto" field-of-view="38deg" min-camera-orbit="auto 10deg auto" max-camera-orbit="auto 88deg auto" interaction-prompt="auto" alt="Projeto em 3D">' +
      '<button slot="ar-button" class="ar">Ver na sua casa (realidade aumentada)</button>' +
      '<div class="hint">Arraste para girar</div></model-viewer>';
    const mv = document.querySelector("model-viewer");
    mv.addEventListener("error", () => { $("stage").innerHTML = '<div class="msg">Não foi possível abrir este projeto. O link pode ter expirado.</div>'; });
  });
}
</script>
</body>
</html>
