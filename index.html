<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu projeto em 3D · KitClos</title>
<meta name="theme-color" content="#0A1220">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  :root { --bg:#0A1220; --ink:#EAF2FA; --muted:#9FB0C3; --accent:#4FB0FF; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; height:100dvh; overflow:hidden; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header, footer { flex:none; }
  #stage { position:relative; flex:1 1 auto; min-height:0; display:flex; }
  header { padding:14px 18px 10px; display:flex; align-items:center; gap:12px; }
  header svg { flex:none; }
  .t1 { font-size:18px; font-weight:700; line-height:1.2; }
  .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
  model-viewer { position:absolute; inset:0; width:100%; height:100%; background:radial-gradient(circle at 50% 40%, #1b2a42 0%, #0A1220 75%); --poster-color:transparent; }
  .ar { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--accent); color:#04111F; border:0;
        border-radius:999px; padding:14px 22px; font-size:16px; font-weight:700; box-shadow:0 6px 24px rgba(79,176,255,.45); }
  footer { padding:10px 18px 16px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; }
  footer a { color:var(--accent); text-decoration:none; }
  .tools { position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:8px; z-index:3; }
  .tools button { width:44px; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(10,18,32,.8); color:#EAF2FA; font-size:18px; }
  .ar { display:flex; align-items:center; gap:10px; }
  .ar svg { flex:none; }
  .coach { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; pointer-events:none; z-index:4; }
  .coach div { background:rgba(10,18,32,.82); padding:18px 22px; border-radius:16px; max-width:320px; font-size:16px; line-height:1.4; }
  .coach b { color:var(--accent); }
  model-viewer[ar-status="session-started"] .coach.track { display:flex; }
  .qr { position:absolute; left:16px; bottom:16px; background:#fff; color:#0A1220; padding:12px; border-radius:14px; display:none; text-align:center; font-size:12px; font-weight:600; z-index:3; }
  .qr img, .qr canvas { display:block; margin:0 auto 6px; }
  .howto { position:absolute; left:50%; bottom:86px; transform:translateX(-50%); width:min(92%,420px); background:rgba(10,18,32,.9); border:1px solid rgba(255,255,255,.12);
           border-radius:16px; padding:14px 16px; font-size:14px; line-height:1.45; color:var(--ink); display:none; z-index:3; }
  .howto ol { margin:6px 0 0 18px; padding:0; }
  .howto .x { position:absolute; right:10px; top:6px; background:none; border:0; color:var(--muted); font-size:20px; }
  .hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(10,18,32,.75); padding:6px 12px; border-radius:999px; font-size:12px; color:var(--muted); }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); }
.in360{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:5;border:0;border-radius:24px;padding:12px 20px;background:rgba(10,18,32,.85);border:1px solid rgba(255,255,255,.2);color:#EAF2FA;font:600 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <svg width="38" height="38" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#121C2E"/><path d="M14 14h36v10H24v26H14z" fill="none" stroke="#4FB0FF" stroke-width="3"/><rect x="17" y="17" width="9" height="9" fill="#4FB0FF" opacity=".6"/><rect x="30" y="17" width="9" height="5" fill="#4FB0FF" opacity=".6"/><rect x="33" y="34" width="14" height="8" rx="1.5" fill="none" stroke="#EAF2FA" stroke-width="2"/></svg>
  <div><div class="t1" id="title"></div><div class="t2" id="sub"></div></div>
</header>
<div id="stage">
  <div class="msg" id="msg"></div>
</div>
<footer id="foot"></footer>
<script>
const SUPA = "https://trivhkkxkdxjrgxgxntn.supabase.co/storage/v1/object/public/kitclos/";
// o código vem em ?k=… ou no fim do endereço: …/kitclos-viewer/silva-cozinha-4f2a
const k = new URLSearchParams(location.search).get("k") || decodeURIComponent(location.pathname.replace(/\/+$/, "").split("/").pop() || "");
const $ = id => document.getElementById(id);
// textos da página em inglês (padrão), espanhol e português: vem do app ("lang") ou do idioma do celular
const TX = {
  en: { loading: "Loading the project…", load2: "Loading…", bad: "Invalid link", badMsg: "Ask your designer for a new link.", your: "Your project", proj: "Project",
        turn: "Turn with one finger · zoom with two", ar: "See it in your home", arGo: "Ready — tap to open the camera", coach: "Point the phone at the <b>floor</b> and move it slowly from side to side.<br><br>When it appears, <b>drag</b> with one finger to move it and <b>rotate</b> with two.",
        hint: "Drag to rotate · two fingers to zoom", top: "Top view", front: "Front view", full: "Full screen", inside: "Stand inside (360°)", outside: "Back to outside",
        howT: "See it in your home (augmented reality)", how1: "Tap <b>See it in your home</b>.", how2: "Stand in the room and point the camera at the <b>floor</b>.",
        how3: "Move the phone slowly until the project appears at real size.", how4: "Drag it into place and walk around it.",
        qr: "Point your phone camera<br>to see it in your home", arFail: "Augmented reality couldn't open on this device. Update Google Play Services for AR (Android) or use Safari (iPhone).",
        err: "This project couldn't be opened. The link may have expired.", alt: "3D project" },
  es: { loading: "Cargando el proyecto…", load2: "Cargando…", bad: "Enlace inválido", badMsg: "Pide un enlace nuevo a tu diseñador.", your: "Tu proyecto", proj: "Proyecto",
        turn: "Gira con un dedo · zoom con dos", ar: "Ver en tu casa", arGo: "Listo — toca para abrir la cámara", coach: "Apunta el celular al <b>piso</b> y muévelo despacio de un lado a otro.<br><br>Cuando aparezca, <b>arrastra</b> con un dedo para moverlo y <b>gira</b> con dos.",
        hint: "Arrastra para girar · dos dedos para zoom", top: "Vista superior", front: "De frente", full: "Pantalla completa", inside: "Estar adentro (360°)", outside: "Volver afuera",
        howT: "Ver en tu casa (realidad aumentada)", how1: "Toca <b>Ver en tu casa</b>.", how2: "Párate en el espacio y apunta la cámara al <b>piso</b>.",
        how3: "Mueve el celular despacio hasta que el proyecto aparezca en tamaño real.", how4: "Arrástralo a su lugar y camina alrededor.",
        qr: "Apunta la cámara del celular<br>para verlo en tu casa", arFail: "No se pudo abrir la realidad aumentada en este dispositivo. Actualiza Google Play Services para RA (Android) o usa Safari (iPhone).",
        err: "No se pudo abrir este proyecto. El enlace puede haber vencido.", alt: "Proyecto en 3D" },
  pt: { loading: "Carregando o projeto…", load2: "Carregando…", bad: "Link inválido", badMsg: "Peça um link novo ao seu projetista.", your: "Seu projeto", proj: "Projeto",
        turn: "Gire com um dedo · zoom com dois", ar: "Ver na sua casa", arGo: "Pronto — toque para abrir a câmera", coach: "Aponte o celular para o <b>chão</b> e mova devagar de um lado para o outro.<br><br>Quando aparecer, <b>arraste</b> com um dedo para mudar de lugar e <b>gire</b> com dois.",
        hint: "Arraste para girar · dois dedos para zoom", top: "Vista de cima", front: "De frente", full: "Tela cheia", inside: "Ficar dentro (360°)", outside: "Voltar para fora",
        howT: "Ver na sua casa (realidade aumentada)", how1: "Toque em <b>Ver na sua casa</b>.", how2: "Fique em pé no ambiente e aponte a câmera para o <b>chão</b>.",
        how3: "Mova o celular devagar até o projeto aparecer no tamanho real.", how4: "Arraste para encaixar no lugar e ande em volta.",
        qr: "Aponte a câmera do celular<br>para ver na sua casa", arFail: "Não deu para abrir a realidade aumentada neste aparelho. Atualize o Google Play Services para RA (Android) ou use o Safari (iPhone).",
        err: "Não foi possível abrir este projeto. O link pode ter expirado.", alt: "Projeto em 3D" },
};
const pick = l => (l && TX[l.slice(0, 2)]) ? l.slice(0, 2) : null;
let L = TX[pick(new URLSearchParams(location.search).get("lang")) || pick(navigator.language) || "en"];
$("title").textContent = L.loading; $("msg").textContent = L.load2;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if (!k || !/^[a-z0-9-]{6,80}$/.test(k)) {
  $("title").textContent = L.bad; $("msg").textContent = L.badMsg;
} else {
  fetch(SUPA + k + ".json").then(r => r.ok ? r.json() : {}).catch(() => ({})).then(info => {
    // o idioma escolhido no app vale, a não ser que o endereço peça outro (?lang=)
    const forced = pick(new URLSearchParams(location.search).get("lang"));
    if (!forced && pick(info.lang)) L = TX[pick(info.lang)];
    document.documentElement.lang = Object.keys(TX).find(x => TX[x] === L) || "en";
    $("title").textContent = (info.name || L.your) + (info.client ? " · " + info.client : "");
    $("sub").textContent = info.finish || "";
    document.title = (info.name || L.proj) + " · " + (info.company || "KitClos");
    const parts = [];
    if (info.company) parts.push("<b>" + esc(info.company) + "</b>");
    if (info.phone) parts.push('<a href="tel:' + esc(info.phone.replace(/[^+\d]/g, "")) + '">' + esc(info.phone) + "</a>");
    if (info.email) parts.push('<a href="mailto:' + esc(info.email) + '">' + esc(info.email) + "</a>");
    parts.push(L.turn);
    $("foot").innerHTML = parts.join(" · ");
    const front = (typeof info.theta === "number" ? info.theta : 30) + "deg";
    $("stage").innerHTML =
      '<model-viewer src="' + SUPA + k + '.glb" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="3000" rotation-per-second="14deg" ' +
      'shadow-intensity="1" exposure="1.05" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" ' +
      'camera-orbit="' + front + ' 62deg auto" field-of-view="38deg" min-camera-orbit="auto 10deg auto" max-camera-orbit="auto 88deg auto" interaction-prompt="auto" alt="' + L.alt + '">' +
      '<button slot="ar-button" class="ar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>' + L.ar + '</button>' +
      '<div class="coach track"><div>' + L.coach + '</div></div>' +
      '<div class="hint">' + L.hint + '</div></model-viewer>' +
      '<div class="tools"><button id="bTop" title="' + L.top + '">⤒</button><button id="bFront" title="' + L.front + '">◉</button><button id="bFull" title="' + L.full + '">⛶</button></div>' +
      '<button id="b360" class="in360">' + L.inside + '</button>' +
      '<div class="howto" id="howto"><button class="x" id="hx">×</button><b>' + L.howT + '</b><ol>' +
      '<li>' + L.how1 + '</li><li>' + L.how2 + '</li>' +
      '<li>' + L.how3 + '</li><li>' + L.how4 + '</li></ol></div>' +
      '<div class="qr" id="qr"><div id="qrc"></div>' + L.qr + '</div>';
    const mv = document.querySelector("model-viewer");
    // 360°: câmera parada no meio da cozinha, na altura dos olhos, olhando em volta
    let inside = false;
    const outsideView = () => {
      mv.cameraTarget = "auto auto auto"; mv.minCameraOrbit = "auto 10deg auto"; mv.maxCameraOrbit = "auto 88deg auto";
      mv.fieldOfView = "38deg"; mv.cameraOrbit = front + " 62deg auto";
    };
    $("b360").onclick = () => {
      inside = !inside; mv.autoRotate = false;
      $("b360").textContent = inside ? L.outside : L.inside;
      if (!inside) { outsideView(); return; }
      const c = mv.getBoundingBoxCenter(), d = mv.getDimensions();
      const eye = (c.y - d.y / 2) + Math.min(1.5, d.y * 0.7);
      mv.cameraTarget = c.x + "m " + eye + "m " + c.z + "m";
      mv.minCameraOrbit = "auto 35deg 0.05m"; mv.maxCameraOrbit = "auto 145deg 0.2m"; mv.maxFieldOfView = "95deg";
      mv.fieldOfView = "80deg"; mv.cameraOrbit = front + " 90deg 0.1m";
    };
    $("bTop").onclick = () => { if (inside) $("b360").onclick(); mv.cameraOrbit = "0deg 8deg auto"; mv.autoRotate = false; };
    $("bFront").onclick = () => { if (inside) $("b360").onclick(); mv.cameraOrbit = front + " 62deg auto"; mv.autoRotate = false; };
    $("bFull").onclick = () => { const e = document.documentElement; (e.requestFullscreen || e.webkitRequestFullscreen || (()=>{})).call(e); };
    $("hx").onclick = () => { $("howto").style.display = "none"; try { localStorage.setItem("kc_howto", "1"); } catch (_) {} };
    mv.addEventListener("load", () => {
      if (mv.canActivateAR) {
        let seen = false; try { seen = localStorage.getItem("kc_howto") === "1"; } catch (_) {}
        if (!seen) $("howto").style.display = "block";
      } else if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        // no computador: QR code para abrir no celular
        const s2 = document.createElement("script");
        s2.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
        s2.onload = () => { const q = qrcode(0, "M"); q.addData(location.href); q.make(); $("qrc").innerHTML = q.createImgTag(4, 0); $("qr").style.display = "block"; };
        document.head.appendChild(s2);
      }
    });
    // links novos: o 3D do navegador tem paredes; a realidade aumentada usa o arquivo sem paredes (as paredes reais já estão lá)
    const SRC = SUPA + k + ".glb", SRC_AR = SUPA + k + "-ar.glb";
    let arReady = !info.ar;
    const arBtn = mv.querySelector('button[slot="ar-button"]');
    if (arBtn && info.ar) arBtn.addEventListener("click", (ev) => {
      if (arReady) return;
      // 1º toque: troca para o modelo sem paredes; 2º toque abre a câmera (o celular exige um toque direto para abrir)
      ev.stopPropagation(); ev.preventDefault();
      arBtn.disabled = true; arBtn.style.opacity = "0.7";
      mv.addEventListener("load", () => {
        arReady = true; arBtn.disabled = false; arBtn.style.opacity = "";
        arBtn.lastChild.textContent = L.arGo;
      }, { once: true });
      mv.src = SRC_AR;
    }, true);
    // voltou da câmera: as paredes voltam
    let arLeft = false;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { if (arReady && info.ar) arLeft = true; return; }
      if (arLeft) { arLeft = false; arReady = false; mv.src = SRC; arBtn.lastChild.textContent = L.ar; }
    });
    mv.addEventListener("ar-status", (ev) => {
      if (ev.detail.status === "failed") alert(L.arFail);
      if (info.ar && ev.detail.status === "not-presenting" && arReady) { arReady = false; mv.src = SRC; arBtn.lastChild.textContent = L.ar; }
    });
    mv.addEventListener("error", () => { $("stage").innerHTML = '<div class="msg">' + L.err + '</div>'; });
  });
}
</script>
</body>
</html>
