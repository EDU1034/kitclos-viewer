<style>
  :root { --bg:#0A1220; --ink:#EAF2FA; --muted:#9FB0C3; --accent:#4FB0FF; }

  body { display:flex; flex-direction:column; height:100vh; height:100dvh; }

  header { padding:14px 18px 10px; display:flex; align-items:center; gap:12px; }
  header svg { flex:none; }
  .t1 { font-size:18px; font-weight:700; line-height:1.2; }
  .t2 { font-size:13px; color:var(--muted); margin-top:2px; }

  footer { padding:10px 18px 16px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; }
  footer a { color:var(--accent); text-decoration:none; }
  .light { position:absolute; left:12px; top:12px; z-index:3; display:flex; flex-wrap:wrap; max-width:calc(100% - 80px); gap:4px; padding:4px; border-radius:14px; background:rgba(10,18,32,.8); border:1px solid rgba(255,255,255,.15); }

  model-viewer { transition: filter .6s ease; }
  .tools { position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:8px; z-index:3; }
  .tools button { width:44px; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(10,18,32,.8); color:#EAF2FA; font-size:18px; }
  .ar { display:flex; align-items:center; gap:10px; }
  .ar svg { flex:none; }
  .coach { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; pointer-events:none; z-index:4; }
  .coach div { background:rgba(10,18,32,.82); padding:18px 22px; border-radius:16px; max-width:320px; font-size:16px; line-height:1.4; }
  .coach b { color:var(--accent); }
  model-viewer[ar-status="session-started"] .coach.track { display:flex; }
  .qr { position:absolute; left:16px; bottom:16px; background:#fff; color:#0A1220; padding:12px; border-radius:14px; display:none; text-align:center; font-size:12px; font-weight:600; z-index:3; }
  .qr img, .qr canvas { display:block; margin:0 auto 6px; }
  .howto { position:absolute; left:50%; bottom:86px; transform:translateX(-50%); width:min(92%,420px); background:rgba(10,18,32,.9); border:1px solid rgba(255,255,255,.12);
           border-radius:16px; padding:14px 16px; font-size:14px; line-height:1.45; color:var(--ink); display:none; z-index:3; }
  .howto ol { margin:6px 0 0 18px; padding:0; }
  .howto .x { position:absolute; right:10px; top:6px; background:none; border:0; color:var(--muted); font-size:20px; }
  .hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(10,18,32,.75); padding:6px 12px; border-radius:999px; font-size:12px; color:var(--muted); }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); }
.photo{position:absolute;inset:0;z-index:6;display:none;background:#0A1220}
.photo canvas{position:absolute;inset:0;width:100%;height:100%}
.photo .bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:2}
.photo .bar button{white-space:nowrap;border:0;border-radius:999px;padding:12px 18px;font:700 15px system-ui,sans-serif}
.photo .back{background:rgba(10,18,32,.85);color:#EAF2FA;border:1px solid rgba(255,255,255,.2)!important}
.photo .save{background:var(--accent);color:#04111F}
.photo .prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(10,18,32,.8);padding:8px 14px;border-radius:999px;font-size:13px;color:#EAF2FA;z-index:2}
.light{flex-wrap:wrap;max-width:calc(100% - 84px)}
.light .pbtn{flex:1 1 auto;margin-left:4px;background:linear-gradient(135deg,#4FB0FF,#2F66D6);color:#fff;box-shadow:0 2px 10px rgba(47,102,214,.45)}
@media (max-width:600px){.hint{display:none}.light button{padding:8px 9px;font-size:13px}.light .pbtn{margin-left:0}}
.in360{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:5;border:0;border-radius:24px;padding:12px 20px;background:rgba(10,18,32,.85);border:1px solid rgba(255,255,255,.2);color:#EAF2FA;font:600 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35)}

const pick = l => (l && TX[l.slice(0, 2)]) ? l.slice(0, 2) : null;
let L = TX[pick(new URLSearchParams(location.search).get("lang")) || pick(navigator.language) || "en"];

  $("title").textContent = L.bad; $("msg").textContent = L.badMsg;

  fetch(SUPA + k + ".json").then(r => r.ok ? r.json() : {}).catch(() => ({})).then(info => {
    // o idioma escolhido no app vale, a não ser que o endereço peça outro (?lang=)
    const forced = pick(new URLSearchParams(location.search).get("lang"));

    document.documentElement.lang = Object.keys(TX).find(x => TX[x] === L) || "en";
    $("title").textContent = (info.name || L.your) + (info.client ? " · " + info.client : "");
    $("sub").textContent = info.finish || "";

    const parts = [];
    if (info.company) parts.push("<b>" + esc(info.company) + "</b>");

    parts.push(L.turn);
    $("foot").innerHTML = parts.join(" · ");
    const th = (typeof info.theta === "number" ? info.theta : 30);
    const front = th + "deg";
    // links com paredes: a câmera gira só pelo lado de dentro (até 80° para cada lado), nunca por trás dos armários
    const minO = info.ar ? (th - 80) + "deg 10deg auto" : "auto 10deg auto";
    const maxO = info.ar ? (th + 80) + "deg 88deg auto" : "auto 88deg auto";
    $("stage").innerHTML =
      '<model-viewer src="' + SUPA + k + '.glb" camera-controls touch-action="pan-y" ' + (info.ar ? '' : 'auto-rotate auto-rotate-delay="3000" rotation-per-second="14deg" ') +
      'shadow-intensity="1" exposure="1.05" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" ' +
      'camera-orbit="' + front + ' 62deg auto" field-of-view="38deg" min-camera-orbit="' + minO + '" max-camera-orbit="' + maxO + '" interaction-prompt="auto" alt="' + L.alt + '">' +
      '<button slot="ar-button" class="ar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>' + L.ar + '</button>' +
      '<div class="coach track"><div>' + L.coach + '</div></div>' +
      '<div class="hint">' + L.hint + '</div></model-viewer>' +
      '<div class="light" id="light">' + ["morning", "noon", "afternoon", "night"].map(m => '<button data-m="' + m + '"' + (m === "noon" ? ' class="on"' : '') + '>' + L[m] + '</button>').join("") + '<button id="bPhoto" class="pbtn">' + L.photo + '</button></div>' +
      '<div class="tools"><button id="bTop" title="' + L.top + '">⤒</button><button id="bFront" title="' + L.front + '">◉</button><button id="bFull" title="' + L.full + '">⛶</button></div>' +
      '<button id="b360" class="in360">' + L.inside + '</button>' +
      '<div class="photo" id="photo"><canvas id="ptc"></canvas><div class="prog" id="pprog"></div>' +
      '<div class="bar"><button class="back" id="pback">' + L.photoBack + '</button><button class="save" id="psave" style="display:none">' + L.photoSave + '</button></div></div>' +

        s2.onload = () => { const q = qrcode(0, "M"); q.addData(location.href); q.make(); $("qrc").innerHTML = q.createImgTag(4, 0); $("qr").style.display = "block"; };
        document.head.appendChild(s2);
      }
    });
    // links novos: o 3D do navegador tem paredes; a realidade aumentada usa o arquivo sem paredes (as paredes reais já estão lá)
    const SRC = SUPA + k + ".glb", SRC_AR = SUPA + k + "-ar.glb";
    let arReady = !info.ar;
    const arBtn = mv.querySelector('button[slot="ar-button"]');
    if (arBtn && info.ar) arBtn.addEventListener("click", (ev) => {

    });

    // luz do dia: manhã (fria e clara), meio-dia (neutra), tarde (quente, sombra forte), noite (luz da casa, quente e baixa)
    const LIGHT = {

      noon:      { exp: 1.05, sh: 1.0, soft: 0.6, f: "none", bg: "radial-gradient(circle at 50% 40%, #1b2a42 0%, #0A1220 75%)" },
      afternoon: { exp: 0.98, sh: 1.3, soft: 0.35, f: "sepia(.28) saturate(1.2) brightness(.98)", bg: "radial-gradient(circle at 50% 40%, #5a3d2a 0%, #1a120c 78%)" },
      night:     { exp: 0.62, sh: 0.45, soft: 1.0, f: "sepia(.38) saturate(1.1) brightness(.86) contrast(1.06)", bg: "radial-gradient(circle at 50% 40%, #121a2a 0%, #03060c 80%)" },

    };
    document.querySelectorAll("#light button[data-m]").forEach(b => b.addEventListener("click", () => apply(b.dataset.m)));
    const pause = ms => new Promise(r => setTimeout(r, ms));

        sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
      }
      return n ? { clip: clip / n, mean: sum / n } : { clip: 0, mean: 0 };
    };
    mv.addEventListener("load", async () => {
      if (calibrated) return; calibrated = true;
      try {
        await pause(700);
        let r = await measure();
        if (r.clip < 0.05 && r.mean < 0.74) return;
        bright = true; mv.toneMapping = "aces"; kExp = 0.95; apply(cur);
        for (let i = 0; i < 3; i++) {
          await pause(400); r = await measure();
          if (r.clip <= 0.03 && r.mean <= 0.72) break;
          kExp *= 0.9; apply(cur);
        }
      } catch (_) {}
    });
    // Foto realista: o mesmo modelo, do mesmo ângulo, desenhado com traçado de raios (luz rebatendo nas paredes,
    // sombras suaves e reflexos de verdade). Roda no próprio celular, sem IA e sem custo; vai ficando nítida em segundos.
    const SKY = {
      morning:   { top: 0xdfeaff, bottom: 0x8a8f99, env: 1.15, sun: 0xfff2e0, sunI: 2.2, el: 22, az: 60, exp: 1.0 },
      noon:      { top: 0xffffff, bottom: 0x9a9a96, env: 1.25, sun: 0xffffff, sunI: 2.6, el: 62, az: 20, exp: 1.0 },
      afternoon: { top: 0xffe2c0, bottom: 0x8f7a66, env: 1.0,  sun: 0xffc58a, sunI: 2.4, el: 18, az: -60, exp: 1.0 },
      night:     { top: 0x1a2236, bottom: 0x0c0f16, env: 0.25, sun: 0xffd9a0, sunI: 0.0, el: 60, az: 0, exp: 1.6 },
    };
    let ptRun = null;
    const stopPhoto = () => { if (ptRun) { ptRun.stop = true; ptRun = null; } $("photo").style.display = "none"; };
    $("pback").onclick = stopPhoto;
    $("psave").onclick = () => {
      const a = document.createElement("a"); a.download = (k || "kitclos") + ".jpg";
      a.href = $("ptc").toDataURL("image/jpeg", 0.92); a.click();
    };
    $("bPhoto").onclick = async () => {
      if (inside) $("b360").onclick();
      mv.autoRotate = false;
      const box = $("photo"); box.style.display = "block"; $("psave").style.display = "none";
      $("pprog").textContent = L.photoBusy;
      const run = { stop: false }; ptRun = run;
      try {
        const THREE = await import("three");
        const { GLTFLoader } = await import("three/examples/jsm/loaders/GLTFLoader.js");
        const { WebGLPathTracer, GradientEquirectTexture } = await import("three-gpu-pathtracer");
        if (run.stop) return;
        const cv = $("ptc"), rect = box.getBoundingClientRect();
        const phone = /Android|iPhone|iPad/i.test(navigator.userAgent);
        const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, phone ? 1.5 : 2));
        renderer.setSize(rect.width, rect.height, false);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        const sky = SKY[cur] || SKY.noon;
        renderer.toneMappingExposure = sky.exp * (bright ? 0.9 : 1.05);
        const scene = new THREE.Scene();
        const gltf = await new GLTFLoader().loadAsync(mv.src);
        if (run.stop) { renderer.dispose(); return; }
        // o traçado de raios decide frente/verso pela ordem dos vértices: acerta a ordem para bater com a normal
        // (senão bancada e tampos saem pretos)
        gltf.scene.traverse(m => {
          if (!m.isMesh) return;
          let g = m.geometry; if (g.index) { g = g.toNonIndexed(); m.geometry = g; }
          // o arquivo vem intercalado (posição+normal juntas): separa para poder mexer
          for (const nm of Object.keys(g.attributes)) if (g.attributes[nm].isInterleavedBufferAttribute) g.setAttribute(nm, g.attributes[nm].clone());
          const P = g.attributes.position, N = g.attributes.normal; if (!N) return;
          const atts = Object.values(g.attributes), p = P.array, n = N.array;
          for (let t = 0; t + 2 < P.count; t += 3) {
            const a = t * 3, b = a + 3, c = a + 6;
            const ux = p[b] - p[a], uy = p[b + 1] - p[a + 1], uz = p[b + 2] - p[a + 2];
            const vx = p[c] - p[a], vy = p[c + 1] - p[a + 1], vz = p[c + 2] - p[a + 2];
            const gx = uy * vz - uz * vy, gy = uz * vx - ux * vz, gz = ux * vy - uy * vx;
            if (gx * (n[a] + n[b] + n[c]) + gy * (n[a + 1] + n[b + 1] + n[c + 1]) + gz * (n[a + 2] + n[b + 2] + n[c + 2]) >= 0) continue;
            for (const at of atts) {
              const s2 = at.itemSize, arr = at.array, i1 = (t + 1) * s2, i2 = (t + 2) * s2;
              for (let q = 0; q < s2; q++) { const tmp = arr[i1 + q]; arr[i1 + q] = arr[i2 + q]; arr[i2 + q] = tmp; }
            }
          }
          for (const at of atts) at.needsUpdate = true;
        });
        scene.add(gltf.scene);
        const env = new GradientEquirectTexture();
        env.topColor.set(sky.top); env.bottomColor.set(sky.bottom); env.update();
        scene.environment = env; scene.environmentIntensity = sky.env;
        scene.background = new THREE.Color(0x0A1220);
        // sol entrando de lado, do alto (sombra suave dos gabinetes de cima na bancada)
        if (sky.sunI > 0) {
          const bb = new THREE.Box3().setFromObject(gltf.scene), c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length();
          const sun = new THREE.DirectionalLight(sky.sun, sky.sunI);
          const el = sky.el * Math.PI / 180, az = (sky.az + (info.theta || 30)) * Math.PI / 180;
          sun.position.set(c.x + r * Math.cos(el) * Math.sin(az), c.y + r * Math.sin(el), c.z + r * Math.cos(el) * Math.cos(az));
          sun.target.position.copy(c); scene.add(sun); scene.add(sun.target);
        }
        // a mesma câmera do 3D (ângulo, distância e lente)
        const o = mv.getCameraOrbit(), t = mv.getCameraTarget(), fov = mv.getFieldOfView();
        const cam = new THREE.PerspectiveCamera(fov, rect.width / rect.height, 0.02, 500);
        cam.position.set(t.x + o.radius * Math.sin(o.phi) * Math.sin(o.theta), t.y + o.radius * Math.cos(o.phi), t.z + o.radius * Math.sin(o.phi) * Math.cos(o.theta));
        cam.lookAt(t.x, t.y, t.z); cam.updateMatrixWorld();
        const pt = new WebGLPathTracer(renderer);
        // rápido: sem ladrilhos (cada amostra é a tela inteira), resolução menor no celular e 3 rebatidas de luz
        pt.tiles.set(1, 1);
        pt.renderScale = phone ? 0.6 : 0.85;
        pt.bounces = 3; pt.filterGlossyFactor = 0.5;
        pt.setScene(scene, cam);
        // a foto fica pronta num tempo fixo (uns 12 s no celular): mede quanto o aparelho leva por amostra e decide quantas dá
        const budget = phone ? 12000 : 9000, minS = 24, maxS = phone ? 160 : 300;
        const t0 = performance.now();
        let goal = maxS;
        $("psave").style.display = ""; // dá para salvar a qualquer momento
        const loop = () => {
          if (run.stop) { pt.dispose && pt.dispose(); renderer.dispose(); return; }
          pt.renderSample();
          const el = performance.now() - t0;
          if (pt.samples === 8) goal = Math.max(minS, Math.min(maxS, Math.round(8 * budget / Math.max(el, 1))));
          const p = Math.min(100, Math.round(pt.samples / goal * 100));
          if (p < 100) { $("pprog").textContent = L.photoBusy + " " + p + "%"; requestAnimationFrame(loop); }
          else { $("pprog").textContent = L.photoDone + " ✓"; }
        };
        loop();
      } catch (e) {
        console.error(e);
        $("pprog").textContent = L.photoFail;
      }
    };
    mv.addEventListener("error", () => { $("stage").innerHTML = '<div class="msg">' + L.err + '</div>'; });
  });
}
</script>
</body>
</html>
